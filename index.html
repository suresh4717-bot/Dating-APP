<!DOCTYPE html>
<html>
<head>
    <title>Dating-APP Doc Generator</title>
    <!-- Essential libraries for building and saving the Word document -->
   <script src="https://unpkg.com"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #F5F5F5; 
            margin: 0;
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh;
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
        }
        h2 { color: #1A56A0; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 2px solid #E0E0E0; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        input:focus { border-color: #1A56A0; outline: none; }
        button { 
            background: #1A56A0; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            width: 100%; 
            transition: background 0.3s; 
        }
        button:hover { background: #144580; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dating-APP Generator</h2>
    <p>Enter a project name below to generate your document.</p>
    <input type="text" id="projName" placeholder="e.g. My Dating App Proposal">
    <button onclick="generateDoc()">Create Word Document</button>
</div>

<script>
// Use the 'docx' library from the script tag above
const { Document, Packer, Paragraph, TextRun, HeadingLevel } = docx;

// Helper functions for document styling
function h1(text) {
  return new Paragraph({
    heading: HeadingLevel.HEADING_1,
    spacing: { before: 360, after: 160 },
    children: [new TextRun({ text, font: "Arial", size: 36, bold: true, color: "1A1A2E" })]
  });
}

function bodyText(text) {
  return new Paragraph({
    spacing: { before: 120, after: 120 },
    children: [new TextRun({ text, font: "Arial", size: 22, color: "333333" })]
  });
}

async function generateDoc() {
    const name = document.getElementById('projName').value || "My Project";
    
    // Build the document structure
    const doc = new Document({
        sections: [{
            children: [
                h1(name),
                bodyText("This document was professionally generated using the Dating-APP automated system."),
                bodyText("Project Name: " + name),
                bodyText("Generated on: " + new Date().toLocaleDateString())
            ],
        }],
    });

    try {
        // Convert document to a "blob" (a file-like object)
        const blob = await Packer.toBlob(doc);
        // Trigger the browser's download functionality
        saveAs(blob, name.replace(/\s+/g, '_') + "_Proposal.docx");
    } catch (error) {
        console.error("Error generating document:", error);
        alert("Something went wrong. Please check the console for details.");
    }
}
</script>

</body>
</html>
